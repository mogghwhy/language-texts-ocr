name: language-texts-ocr

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write  # For git commit/push

jobs:
    snapshot-ocr:
        runs-on: ubuntu-latest
        steps:
          - name: "Checkout Repo"
            uses: actions/checkout@v6
          - name: "Setup Python"
            uses: actions/setup-python@v6
            with:
                python-version: '3.13'
          - name: "Pre-process snapshots"
            run: python ./scripts/main.py "snapshots"
            # run: |
